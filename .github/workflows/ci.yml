name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.32"
      - run: uv python install "${{ matrix.python-version }}"
      - run: uv sync --locked --python "${{ matrix.python-version }}"
      - run: uv run --locked --python "${{ matrix.python-version }}" pytest
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: uv run --locked --python "${{ matrix.python-version }}" ruff check .
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: uv run --locked --python "${{ matrix.python-version }}" ruff format --check .
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: uv run --locked --python "${{ matrix.python-version }}" basedpyright
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: uv build --no-sources
